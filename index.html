<body>
  <main id="scene" data-state="intro">
    <canvas id="night" aria-hidden="true"></canvas>
    <div class="frame" aria-hidden="true"></div>
    <button id="open" type="button" class="intro">
      <span class="intro-content">
        <svg viewBox="0 0 42 42" width="42" height="42" aria-hidden="true"><path d="M21 1c0 14-6 20-20 20 14 0 20 6 20 20 0-14 6-20 20-20C27 21 21 15 21 1Z" fill="none" stroke="currentColor"/></svg>
        <span class="title">Senin için<br><em>küçük bir sürpriz...</em></span>
        <span class="invitation">AÇMAK İÇİN DOKUN <span aria-hidden="true">↗</span></span>
      </span>
    </button>
    <section id="letter" class="letter" tabindex="-1" aria-hidden="true" inert aria-label="Sana bir not">
      <span class="ornament" aria-hidden="true">✧</span>
      <p>Sana dünyanın bütün çiçeklerini veremem ama senin için bir dünya dolusu çiçek açtırabilirim.</p>
      <h1>Seni seviyorum.</h1>
    </section>
    <button id="replay" class="replay" type="button" hidden><span aria-hidden="true">↻</span> Tekrar izle</button>
    <noscript><style>#open{display:none}</style><p class="no-script">Sana dünyanın bütün çiçeklerini veremem ama senin için bir dünya dolusu çiçek açtırabilirim. Seni seviyorum.</p></noscript>
  </main>
